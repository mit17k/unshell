# Unshell terminal defaults (libghostty config syntax).
# Personal overrides go in ~/.config/unshell/ghostty.conf; Ghostty's own config
# files are not loaded.

# Tokyo Night (night), matching apps/unshell-mac Theme.swift
background = 1a1b26
foreground = c0caf5
cursor-color = c0caf5
selection-background = 33467c
selection-foreground = c0caf5
palette = 0=#15161e
palette = 1=#f7768e
palette = 2=#9ece6a
palette = 3=#e0af68
palette = 4=#7aa2f7
palette = 5=#bb9af7
palette = 6=#7dcfff
palette = 7=#a9b1d6
palette = 8=#414868
palette = 9=#f7768e
palette = 10=#9ece6a
palette = 11=#e0af68
palette = 12=#7aa2f7
palette = 13=#bb9af7
palette = 14=#7dcfff
palette = 15=#c0caf5

# Font: libghostty embeds JetBrains Mono and a Nerd Font symbols fallback, so
# powerline/Nerd glyphs render without installing a patched font.
font-size = 13
window-padding-x = 10
window-padding-y = 8

# 50 agents x large scrollback adds up. ~10 MB per terminal.
scrollback-limit-bytes = 10000000

macos-option-as-alt = left
shell-integration = detect
shell-integration-features = cursor,title,sudo

# Unshell has no clipboard confirmation UI yet: allow paste, block OSC 52 reads.
clipboard-paste-protection = false
clipboard-read = deny
clipboard-write = allow
confirm-close-surface = false
copy-on-select = none
